name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages --quiet -r Tools/queen_proxy_kit/requirements.txt

      - name: King cache/refresh logic static tests
        run: bash Scripts/test_king_cache_logic.sh
      - name: Foreground reload/shared-app forwarder static checks
        run: bash Scripts/test_foreground_reload_logic.sh
      - name: Proxy override unit tests
        run: bash Scripts/test_proxy_override.sh
      - name: Alook high-download crash guard static checks
        run: bash Scripts/test_alook_crash_guard.sh

      - name: Async proxy relay test
        run: bash Scripts/test_async_proxy.sh

      - name: Queen crypto self-test
        run: bash Scripts/test_queen_crypto.sh

      - name: Queen WUP binary comparison
        run: bash Scripts/test_queen_wup_compare.sh

      - name: Build dylib (compile/link check)
        run: |
          set -euo pipefail
          ./Scripts/build_ios.sh

      - name: Verify Tailscale control artifacts
        run: |
          set -euo pipefail
          VER="$(cat version.txt | tr -d ' \r\n')"

          test -f "build/LCTailscaleControl-${VER}.dylib"
          test -f "build/LiveProxyTailscaleConsole-${VER}.ipa"
          nm -gU "build/LCTailscaleControl-${VER}.dylib" | grep -E ' _tailscale_(new|set_proxy|set_disable_p2p|get_full_status_json|set_exit_node)$'
          unzip -p "build/LiveProxyTailscaleConsole-${VER}.ipa" Payload/LiveProxyTailscaleConsole.app/Info.plist | grep -q 'com.liveproxy.tailscale.console'
          unzip -p "build/LiveProxyTailscaleConsole-${VER}.ipa" Payload/LiveProxyTailscaleConsole.app/Info.plist | grep -q 'koast18/livecontainer-kingcard-proxy-tailscale'

      - name: Tailscale macOS live smoke test
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -euo pipefail
          bash Scripts/test_tailscale_macos.sh
