name: Build LiveProxy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      update_altstore_source:
        description: 'Update AltStore source after build'
        type: boolean
        default: true
      altstore_branch:
        description: 'Branch to push updated AltStore source'
        default: 'feature/tailscale-integration'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib and IPA
        run: |
          set -euo pipefail
          ./Scripts/build_all.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="$(cat version.txt | tr -d ' \r\n')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              "build/LCTailscaleControl-${VER}.dylib" \
              "build/LiveProxyTailscaleConsole-${VER}.ipa" \
              --title "LiveProxy ${VER}" \
              --notes "LiveProxy Tailscale 控制台 IPA + LCTailscaleControl dylib。添加 AltStore 源：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/AltStore/altstore-source.json"
          else
            gh release upload "$TAG" \
              "build/LCTailscaleControl-${VER}.dylib" \
              "build/LiveProxyTailscaleConsole-${VER}.ipa" --clobber
          fi
      - name: Update AltStore source (optional/auto)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.update_altstore_source == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALTSTORE_BRANCH: ${{ github.event.inputs.altstore_branch || 'feature/tailscale-integration' }}
        run: |
          set -euo pipefail
          git config user.name "koast18"
          git config user.email "33443247+koast18@users.noreply.github.com"
          git checkout "$ALTSTORE_BRANCH" 2>/dev/null || git checkout -b "$ALTSTORE_BRANCH"
          bash Scripts/update_altstore_source.sh "${{ github.repository }}" "" "$ALTSTORE_BRANCH"
          if git diff --quiet AltStore/altstore-source.json; then
            echo "AltStore source unchanged"
          else
            git add AltStore/altstore-source.json
            git commit -m "chore: update AltStore source to $(cat version.txt | tr -d ' \r\n')"

            git push origin "$ALTSTORE_BRANCH"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liveproxy-${{ github.run_id }}
          path: |
            build/*.dylib
            build/*.ipa
