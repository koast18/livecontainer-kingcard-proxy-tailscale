name: Build LiveProxy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib and IPA
        run: |
          set -euo pipefail
          ./Scripts/build_all.sh

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="$(cat version.txt | tr -d ' \r\n')"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              "build/LCTailscaleControl-${VER}.dylib" \
              "build/LiveProxyTailscaleConsole-${VER}.ipa" \
              --title "LiveProxy ${VER}" \
              --notes "LiveProxy Tailscale 控制台 IPA + LCTailscaleControl dylib。添加 AltStore 源：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/AltStore/altstore-source.json"
          else
            gh release upload "$TAG" \
              "build/LCTailscaleControl-${VER}.dylib" \
              "build/LiveProxyTailscaleConsole-${VER}.ipa" --clobber
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liveproxy-${{ github.run_id }}
          path: |
            build/*.dylib
            build/*.ipa
